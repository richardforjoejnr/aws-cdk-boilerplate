name: Ghana Payments — PR Preview

on:
  # NO `branches:` filter. It applies to the PR's *base* branch, so a stacked PR
  # (or one retargeted after opening) never fires `closed` and its preview
  # environment leaks forever — see PR #26, which billed KMS for 10 days after
  # merging. Deploy is gated on the base branch by an `if:` on the job instead,
  # so only `closed` gained reach.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/ghana-payments/**'
      - '.github/workflows/ghana-payments-*.yml'
  # Backstop: catches previews the `closed` event missed for any reason
  # (paths filter, cancelled run, failed destroy, manual deploy).
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Serialize runs per PR — rapid pushes queue instead of racing CloudFormation
concurrency:
  group: ghana-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-east-1'

jobs:
  deploy-preview:
    name: Deploy Ghana Payments preview
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed'
      && (github.base_ref == 'main' || github.base_ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Make scripts executable
        run: chmod +x apps/ghana-payments/scripts/*.sh

      - name: Seed preview admin credentials
        id: creds
        env:
          STAGE: pr-${{ github.event.pull_request.number }}
        run: |
          PASSWORD="Preview$(openssl rand -hex 6)!"
          HASH=$(node -e "const{createHash}=require('crypto');console.log(createHash('sha256').update('ghana-poc:'+process.argv[1]).digest('hex').slice(0,32))" "$PASSWORD")
          aws ssm put-parameter --name "/${STAGE}/ghana-payments/admin/credentials" \
            --type SecureString --overwrite \
            --value "{\"username\":\"admin\",\"password_hash\":\"$HASH\"}"
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Deploy
        id: deploy
        env:
          STAGE: pr-${{ github.event.pull_request.number }}
        run: cd apps/ghana-payments && ./scripts/deploy.sh "$STAGE"

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          PORTAL_URL: ${{ steps.deploy.outputs.portal_url }}
          ADMIN_PASSWORD: ${{ steps.creds.outputs.password }}
        with:
          script: |
            const portal = process.env.PORTAL_URL;
            const body = [
              '## 🇬🇭 Ghana Payments preview deployed',
              `**Environment:** pr-${context.issue.number}`,
              '',
              `**Portal:** ${portal}`,
              `- Merchant portal: ${portal}/admin/ — sign in with \`admin\` / \`${process.env.ADMIN_PASSWORD}\` (preview only)`,
              `- Soundbox: ${portal}/soundbox/`,
              `- Payment page: scan a QR generated in the merchant portal (opens \`${portal}/pay/{qr_id}\`)`,
              '',
              '**Demo flow:** create a merchant → generate + scan its QR → top up the wallet on the pay page → pay. ',
              'Pair a soundbox (register device → Pair… → enter the code) to hear payments announced.',
              '',
              '**Magic amounts (GHS):** `13.00` fails · `9.99` times out + refunds after 5 min · `2.22` duplicate callback (announced once) · anything else succeeds.',
              '',
              '_This environment is destroyed automatically when the PR is merged or closed._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Ghana Payments preview deployed'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

  destroy-preview:
    name: Destroy Ghana Payments preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      # Pin to the base branch. The default ref for a closed PR is
      # refs/pull/<n>/merge, which GitHub garbage-collects soon after the merge —
      # a bare checkout here can fail with "couldn't find remote ref" and skip the
      # teardown entirely. The base branch always exists, and destroy.sh reads the
      # deployed stack list from CloudFormation, so it does not need the PR's code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Make scripts executable
        run: chmod +x apps/ghana-payments/scripts/*.sh

      - name: Destroy and clean up everything
        env:
          STAGE: pr-${{ github.event.pull_request.number }}
        # Detaches per-device IoT policies, destroys the stacks, removes SSM params
        # (incl. the preview admin credentials), then verifies nothing remains.
        run: cd apps/ghana-payments && echo "$STAGE" | ./scripts/destroy.sh "$STAGE"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: '🗑️ Ghana Payments preview environment `pr-' + context.issue.number + '` destroyed and verified clean.',
            });

  reap-orphans:
    name: Reap orphaned Ghana Payments previews
    # Daily backstop. The `closed` event is the primary cleanup path; this catches
    # anything it missed — PRs closed while the workflow was disabled, destroy runs
    # that failed halfway, previews deployed by hand. Destroying a stage whose PR is
    # still open is the one thing it must never do, so it only acts on PRs GitHub
    # reports as closed/merged, and skips on any API error.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Make scripts executable
        run: chmod +x apps/ghana-payments/scripts/*.sh

      - name: Find and destroy previews whose PR is closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGES=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE DELETE_FAILED \
            --query "StackSummaries[?ends_with(StackName,'-ghana-payments-foundation')].StackName" \
            --output text | tr '\t' '\n' | sed -n 's/^\(pr-[0-9]*\)-ghana-payments-foundation$/\1/p' | sort -u)

          [ -n "$STAGES" ] || { echo "No preview environments deployed."; exit 0; }
          echo "Deployed previews: $STAGES"

          REAPED=0
          for STAGE in $STAGES; do
            PR="${STAGE#pr-}"
            STATE=$(gh pr view "$PR" --json state --jq .state 2>/dev/null || echo "UNKNOWN")
            case "$STATE" in
              OPEN)
                echo "::notice::$STAGE — PR #$PR still open, keeping." ;;
              CLOSED|MERGED)
                echo "::warning::$STAGE — PR #$PR is $STATE but the preview is still deployed. Destroying."
                (cd apps/ghana-payments && echo "$STAGE" | ./scripts/destroy.sh "$STAGE")
                REAPED=$((REAPED + 1)) ;;
              *)
                echo "::warning::$STAGE — could not read PR #$PR state ('$STATE'). Skipping, will retry tomorrow." ;;
            esac
          done
          echo "Reaped $REAPED orphaned preview environment(s)."
